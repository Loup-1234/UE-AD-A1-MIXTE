type Query {
  booking_with_id(_userid: String!): Booking
}

type Mutation {
  update_booking_date(
    _userid: String!
    _movie_id: String!
    _date: String!
  ): Booking

  delete_booking(_userid: String!): Boolean!
  delete_booking_movie(_userid: String!, _movie_id: String!): Booking
}

type Booking {
  userid: String!
  dates: [BookingDate!]!
}

type BookingDate {
  date: String!
  movies: [String!]!
}
