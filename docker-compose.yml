services:
  booking:
    build:
      context: .
      dockerfile: booking/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - MOVIE_SERVICE_URL=http://movie:3001/graphql
      - SCHEDULE_SERVICE_URL=http://schedule:3202
      - USER_SERVICE_URL=http://user:3203
      - MONGO_URI=mongodb://root:example@mongo:27017/
    depends_on:
      - movie
      - schedule
      - mongo

  movie:
    build:
      context: .
      dockerfile: movie/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - MONGO_URI=mongodb://root:example@mongo:27017/
    depends_on:
      - mongo

  schedule:
    build:
      context: .
      dockerfile: schedule/Dockerfile
    ports:
      - "3202:3202"
    environment:
      - MOVIE_SERVICE_URL=http://movie:3001/graphql
    depends_on:
      - movie

  user:
    build:
      context: .
      dockerfile: user/Dockerfile
    ports:
      - "3203:3203"
    environment:
      - BOOKING_SERVICE_URL=http://booking:3002/graphql
    depends_on:
      - booking

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://root:example@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

volumes:
  mongo_data:
