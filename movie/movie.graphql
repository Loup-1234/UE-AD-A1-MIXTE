type Query {
  movie_with_id(_id: String!): Movie
  all_movies: [Movie!]!

  actors_with_id(_id: String!): Actor
  all_actors: [Actor!]!
}

type Mutation {
  create_movie(
    _title: String!
    _director: String!
    _rating: Float!
    _id: String
  ): Movie

  update_movie_rate(_id: String!, _rate: Float!): Movie

  update_movie(
    _id: String!
    _title: String
    _director: String
    _rating: Float
  ): Movie

  delete_movie(_id: String!): Boolean!
}

type Movie {
  id: String!
  title: String!
  director: String!
  rating: Float!
  actors: [Actor]
}

type Actor {
  id: String!
  firstname: String!
  lastname: String!
  birthyear: Int!
  films: [String!]
}
