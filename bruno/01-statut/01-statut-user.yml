info:
  name: Statut du service User
  type: http
  seq: 1

http:
  method: GET
  url: "http://localhost:3203/"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("User service returns 200", function () {
          expect(res.status).to.equal(200);
        });

        test("User welcome message is present", function () {
          expect(res.body).to.include("Welcome to the User service!");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
