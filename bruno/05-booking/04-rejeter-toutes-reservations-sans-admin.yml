info:
  name: Refuser all_bookings sans privilèges admin
  type: graphql
  seq: 4

graphql:
  method: POST
  url: http://localhost:3002/graphql
  body:
    query: |-
      query AllBookings {
        all_bookings {
          userid
          dates {
            date
            movies
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Statut 200 avec erreur GraphQL Admin", function () {
          expect(res.status).to.equal(200);
          expect(res.body.errors).to.be.an("array");
          expect(res.body.errors[0].message).to.equal("Admin privileges required");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
